services:
  ruminate:
    build: .
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-glm-4.7}
      MEM0_API_KEY: ${MEM0_API_KEY}
      PERSONALITY_NAME: ${PERSONALITY_NAME:-default}
      THOUGHT_INTERVAL: ${THOUGHT_INTERVAL:-60}
      MAX_TOKENS: ${MAX_TOKENS:-1024}
      MAX_HISTORY: ${MAX_HISTORY:-2}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8080}
      # Attention layer (off | observe | active). Off = legacy behaviour.
      ATTENTION_MODE: ${ATTENTION_MODE:-off}
      ATTENTION_DUPLICATE_WINDOW: ${ATTENTION_DUPLICATE_WINDOW:-5}
      ATTENTION_DEFERRAL_THRESHOLD: ${ATTENTION_DEFERRAL_THRESHOLD:-2}
      ATTENTION_IDLE_BACKOFF_SECONDS: ${ATTENTION_IDLE_BACKOFF_SECONDS:-120}
      ATTENTION_MAX_CONSECUTIVE_REDIRECTS: ${ATTENTION_MAX_CONSECUTIVE_REDIRECTS:-1}
      ATTENTION_LOG_PATH: ${ATTENTION_LOG_PATH:-./logs/attention.jsonl}
      ATTENTION_RANDOM_SEED: ${ATTENTION_RANDOM_SEED:-7}
      ATTENTION_MAX_CYCLES: ${ATTENTION_MAX_CYCLES:-0}
      ATTENTION_MAX_APPROX_TOKENS: ${ATTENTION_MAX_APPROX_TOKENS:-0}
      ATTENTION_STOP_FILE: ${ATTENTION_STOP_FILE:-}
      # Baseline / benchmark harness (0 = unlimited)
      RUN_MAX_THOUGHTS: ${RUN_MAX_THOUGHTS:-0}
      RUN_MAX_SECONDS: ${RUN_MAX_SECONDS:-0}
      RUN_RECORD: ${RUN_RECORD:-false}
      BENCHMARK_MODE: ${BENCHMARK_MODE:-false}
      HISTORY_TOKEN_BUDGET: ${HISTORY_TOKEN_BUDGET:-0}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-}
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ./logs:/app/logs
      - ./personalities:/app/personalities:ro
      - ./prompt.txt:/app/prompt.txt:ro
      - ./seeds.txt:/app/seeds.txt:ro
      - ./mcp_servers.json:/app/mcp_servers.json
      - ./workspace:/workspace
