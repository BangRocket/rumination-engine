services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ruminate
      POSTGRES_PASSWORD: ruminate
      POSTGRES_DB: mem0
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruminate -d mem0"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/ruminate123
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  ruminate:
    build: .
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      POSTGRES_HOST: postgres
      NEO4J_HOST: neo4j
      PERSONALITY_NAME: ${PERSONALITY_NAME:-default}
      THOUGHT_INTERVAL: ${THOUGHT_INTERVAL:-60}
      MAX_TOKENS: ${MAX_TOKENS:-1024}
      MAX_HISTORY: ${MAX_HISTORY:-10}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./personalities:/app/personalities:ro
      - ./prompt.txt:/app/prompt.txt:ro
      - ./seeds.txt:/app/seeds.txt:ro
      - ruminate_data:/data

volumes:
  postgres_data:
  neo4j_data:
  ruminate_data:
