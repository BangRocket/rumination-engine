[tool.poetry]
name = "rumination-engine"
version = "0.1.0"
description = "An input-less LLM thought experiment"
authors = ["Joshua Heidorn"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
anthropic = ">=0.40.0"
openai = ">=1.40.0"
python-dotenv = "*"
rich = "*"
requests = "*"
mcp = {version = ">=1.0.0", extras = ["cli"]}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
