<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clara's Mind</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d1117;
      --bg-surface: #161b22;
      --bg-hover: #1c2129;
      --border: #30363d;
      --text: #c9d1d9;
      --text-dim: #6a737d;
      --green: #4ec9b0;
      --blue: #569cd6;
      --magenta: #c586c0;
      --accent: #58a6ff;
    }

    body {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 14px;
      line-height: 1.6;
    }

    /* Prompt bar */
    .prompt-bar {
      padding: 12px 20px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-height: 44px;
      flex-shrink: 0;
    }
    .prompt-label {
      color: var(--magenta);
      font-weight: 600;
      white-space: nowrap;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .prompt-text {
      color: var(--text);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .prompt-text.empty { color: var(--text-dim); font-style: italic; }

    /* Main layout */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Stream panel */
    .stream-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .stream {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      scroll-behavior: smooth;
    }
    .stream::-webkit-scrollbar { width: 6px; }
    .stream::-webkit-scrollbar-track { background: transparent; }
    .stream::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Thought blocks */
    .thought-header {
      color: var(--text-dim);
      font-size: 12px;
      padding: 16px 0 6px;
      border-top: 1px solid var(--border);
      margin-top: 8px;
    }
    .thought-header:first-child { border-top: none; margin-top: 0; padding-top: 0; }

    .thought-text { color: var(--green); white-space: pre-wrap; word-break: break-word; }
    .tool-call {
      font-size: 12px;
      padding: 4px 8px;
      margin: 4px 0;
      border-radius: 4px;
      background: rgba(86, 156, 214, 0.08);
      border-left: 2px solid var(--blue);
      color: var(--blue);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .tool-call.memory {
      background: rgba(197, 134, 192, 0.08);
      border-left-color: var(--magenta);
      color: var(--magenta);
    }

    /* Status indicator */
    .status {
      padding: 6px 20px;
      font-size: 11px;
      color: var(--text-dim);
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-dim);
    }
    .status-dot.connected { background: var(--green); }
    .status-dot.error { background: #f85149; }

    /* Sidebar */
    .sidebar {
      width: 280px;
      border-left: 1px solid var(--border);
      background: var(--bg-surface);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }
    .sidebar-title {
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }
    .sidebar-list::-webkit-scrollbar { width: 4px; }
    .sidebar-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .sidebar-item {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }
    .sidebar-item:hover { background: var(--bg-hover); }
    .sidebar-item .title {
      color: var(--accent);
      font-size: 13px;
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sidebar-item .preview {
      color: var(--text-dim);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Thought detail overlay */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .overlay.active { display: flex; }
    .overlay-content {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-width: 720px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 24px;
      color: var(--green);
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
      line-height: 1.7;
      position: relative;
    }
    .overlay-close {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 18px;
      font-family: inherit;
    }
    .overlay-close:hover { color: var(--text); }

    /* Responsive: stack on mobile */
    @media (max-width: 700px) {
      .main { flex-direction: column; }
      .sidebar {
        width: 100%;
        border-left: none;
        border-top: 1px solid var(--border);
        max-height: 200px;
      }
    }
  </style>
</head>
<body>

  <div class="prompt-bar">
    <span class="prompt-label">Current Prompt</span>
    <span class="prompt-text empty" id="prompt">Connecting...</span>
  </div>

  <div class="main">
    <div class="stream-panel">
      <div class="stream" id="stream"></div>
      <div class="status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Connecting...</span>
      </div>
    </div>

    <div class="sidebar">
      <div class="sidebar-title">Recent Thoughts</div>
      <ul class="sidebar-list" id="thoughtList"></ul>
    </div>
  </div>

  <div class="overlay" id="overlay" onclick="if(event.target===this)closeOverlay()">
    <div class="overlay-content">
      <button class="overlay-close" onclick="closeOverlay()">&times;</button>
      <div id="overlayBody"></div>
    </div>
  </div>

<script>
const stream = document.getElementById('stream');
const promptEl = document.getElementById('prompt');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const thoughtList = document.getElementById('thoughtList');
const overlay = document.getElementById('overlay');
const overlayBody = document.getElementById('overlayBody');

let autoScroll = true;
let eventSource = null;
let reconnectTimer = null;

// Track auto-scroll: disable if user scrolls up, re-enable at bottom
stream.addEventListener('scroll', () => {
  const atBottom = stream.scrollHeight - stream.scrollTop - stream.clientHeight < 40;
  autoScroll = atBottom;
});

function scrollToBottom() {
  if (autoScroll) stream.scrollTop = stream.scrollHeight;
}

// --- SSE connection ---
function connect() {
  if (eventSource) { eventSource.close(); eventSource = null; }
  clearTimeout(reconnectTimer);

  eventSource = new EventSource('/api/stream');
  setStatus('connected', 'Connected');

  eventSource.addEventListener('thought_start', (e) => {
    const d = JSON.parse(e.data);
    const header = document.createElement('div');
    header.className = 'thought-header';
    header.textContent = `--- Thought ${d.thought_number} \u00b7 ${d.timestamp} ---`;
    stream.appendChild(header);
    scrollToBottom();
  });

  eventSource.addEventListener('thought_chunk', (e) => {
    const d = JSON.parse(e.data);
    // Append to last .thought-text or create one
    let last = stream.lastElementChild;
    if (!last || !last.classList.contains('thought-text')) {
      last = document.createElement('div');
      last.className = 'thought-text';
      stream.appendChild(last);
    }
    last.textContent += d.text;
    scrollToBottom();
  });

  eventSource.addEventListener('tool_call', (e) => {
    const d = JSON.parse(e.data);
    const el = document.createElement('div');
    el.className = 'tool-call' + (d.is_memory ? ' memory' : '');
    el.textContent = `\u25b6 ${d.name}(${d.args})`;
    stream.appendChild(el);
    scrollToBottom();
  });

  eventSource.addEventListener('thought_end', (e) => {
    const d = JSON.parse(e.data);
    addThoughtToSidebar(d.thought_number, d.thought, d.timestamp);
  });

  eventSource.addEventListener('prompt_set', (e) => {
    const d = JSON.parse(e.data);
    setPrompt(d.prompt);
  });

  eventSource.addEventListener('ping', () => {});

  eventSource.onerror = () => {
    setStatus('error', 'Disconnected \u2014 reconnecting...');
    eventSource.close();
    eventSource = null;
    reconnectTimer = setTimeout(connect, 3000);
  };
}

function setStatus(state, text) {
  statusDot.className = 'status-dot ' + state;
  statusText.textContent = text;
}

function setPrompt(text) {
  promptEl.textContent = text || 'No prompt set';
  promptEl.className = 'prompt-text' + (text ? '' : ' empty');
}

// --- Sidebar ---
function addThoughtToSidebar(num, text, timestamp) {
  const li = document.createElement('li');
  li.className = 'sidebar-item';
  const preview = (text || '').replace(/\n/g, ' ').slice(0, 120);
  li.innerHTML = `<div class="title">Thought ${num} &middot; ${timestamp || ''}</div><div class="preview">${escapeHtml(preview)}</div>`;
  li.onclick = () => showThought(text);
  thoughtList.prepend(li);
}

function showThought(text) {
  overlayBody.textContent = text;
  overlay.classList.add('active');
}

function closeOverlay() {
  overlay.classList.remove('active');
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Keyboard: Escape closes overlay
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeOverlay();
});

// --- Initial data load ---
async function loadInitial() {
  try {
    const r = await fetch('/api/current-prompt');
    const d = await r.json();
    setPrompt(d.prompt);
  } catch { setPrompt(null); }

  try {
    const r = await fetch('/api/thoughts');
    const d = await r.json();
    (d.thoughts || []).forEach((t) => {
      const li = document.createElement('li');
      li.className = 'sidebar-item';
      li.innerHTML = `<div class="title">${escapeHtml(t.title)}</div><div class="preview">${escapeHtml(t.preview)}</div>`;
      li.onclick = async () => {
        try {
          const res = await fetch('/api/thought/' + encodeURIComponent(t.id));
          const data = await res.json();
          showThought(data.content);
        } catch { showThought('Failed to load thought.'); }
      };
      thoughtList.appendChild(li);
    });
  } catch {}
}

// --- Boot ---
loadInitial();
connect();
</script>
</body>
</html>
