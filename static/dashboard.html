<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clara's Mind</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d1117;
      --bg-surface: #161b22;
      --bg-hover: #1c2129;
      --border: #30363d;
      --text: #c9d1d9;
      --text-dim: #6a737d;
      --green: #4ec9b0;
      --blue: #569cd6;
      --magenta: #c586c0;
      --accent: #58a6ff;
    }

    body {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 14px;
      line-height: 1.6;
    }

    /* Prompt bar */
    .prompt-bar {
      padding: 12px 20px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-height: 44px;
      flex-shrink: 0;
    }
    .prompt-label {
      color: var(--magenta);
      font-weight: 600;
      white-space: nowrap;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .prompt-text {
      color: var(--text);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .prompt-text.empty { color: var(--text-dim); font-style: italic; }

    /* Main layout */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Stream panel */
    .stream-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .stream {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      scroll-behavior: smooth;
    }
    .stream::-webkit-scrollbar { width: 6px; }
    .stream::-webkit-scrollbar-track { background: transparent; }
    .stream::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Thought blocks */
    .thought-header {
      color: var(--text-dim);
      font-size: 12px;
      padding: 16px 0 6px;
      border-top: 1px solid var(--border);
      margin-top: 8px;
    }
    .thought-header:first-child { border-top: none; margin-top: 0; padding-top: 0; }

    .thought-text { color: var(--green); white-space: pre-wrap; word-break: break-word; }
    .tool-call {
      font-size: 12px;
      padding: 4px 8px;
      margin: 4px 0;
      border-radius: 4px;
      background: rgba(86, 156, 214, 0.08);
      border-left: 2px solid var(--blue);
      color: var(--blue);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .tool-call.memory {
      background: rgba(197, 134, 192, 0.08);
      border-left-color: var(--magenta);
      color: var(--magenta);
    }

    /* Status indicator */
    .status {
      padding: 6px 20px;
      font-size: 11px;
      color: var(--text-dim);
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-dim);
    }
    .status-dot.connected { background: var(--green); }
    .status-dot.error { background: #f85149; }

    /* Sidebar */
    .sidebar {
      width: 280px;
      border-left: 1px solid var(--border);
      background: var(--bg-surface);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }
    .sidebar-title {
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }
    .sidebar-list::-webkit-scrollbar { width: 4px; }
    .sidebar-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .sidebar-item {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }
    .sidebar-item:hover { background: var(--bg-hover); }
    .sidebar-item .title {
      color: var(--accent);
      font-size: 13px;
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sidebar-item .preview {
      color: var(--text-dim);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Attention panel */
    .attention {
      display: none;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px 12px;
      font-size: 12px;
      flex-shrink: 0;
      max-height: 55vh;
      overflow-y: auto;
    }
    .attention.on { display: block; }
    .att-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    .att-title { font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); margin-right: auto; }
    .badge {
      font-size: 10px; padding: 1px 6px; border-radius: 9px; border: 1px solid var(--border);
      color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.4px;
    }
    .badge.state-ENGAGED { color: var(--green); border-color: var(--green); }
    .badge.state-REFLECTING { color: var(--accent); border-color: var(--accent); }
    .badge.state-EXPLORING { color: var(--magenta); border-color: var(--magenta); }
    .badge.state-STALLED, .badge.state-SUSPENDED { color: #f0883e; border-color: #f0883e; }
    .badge.state-IDLE { color: var(--text-dim); }
    .att-next { color: var(--text); margin-bottom: 4px; }
    .att-next b { color: var(--accent); font-weight: 600; }
    .att-cue {
      color: var(--text); background: var(--bg); border-left: 2px solid var(--magenta);
      padding: 4px 8px; margin: 4px 0; white-space: pre-wrap; word-break: break-word;
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    }
    .att-cue[hidden] { display: none; }
    .att-dim { color: var(--text-dim); word-break: break-word; }
    .att-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; margin: 8px 0; color: var(--text-dim); }
    .att-stats span b { color: var(--text); font-weight: 500; }
    .att-sub { margin-top: 8px; color: var(--text-dim); text-transform: uppercase; font-size: 10px; letter-spacing: 0.4px; }
    .att-list { list-style: none; margin-top: 2px; }
    .att-list li { padding: 2px 0; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .att-list li .k { color: var(--text-dim); }
    .attention details summary { cursor: pointer; color: var(--text-dim); margin-top: 8px; font-size: 11px; }
    .attention-note {
      font-size: 11px; color: var(--magenta); padding: 2px 0 6px; opacity: 0.85;
    }

    /* Thought detail overlay */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .overlay.active { display: flex; }
    .overlay-content {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-width: 720px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 24px;
      color: var(--green);
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
      line-height: 1.7;
      position: relative;
    }
    .overlay-close {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 18px;
      font-family: inherit;
    }
    .overlay-close:hover { color: var(--text); }

    /* Responsive: stack on mobile */
    @media (max-width: 700px) {
      .main { flex-direction: column; }
      .sidebar {
        width: 100%;
        border-left: none;
        border-top: 1px solid var(--border);
        max-height: 200px;
      }
    }
  </style>
</head>
<body>

  <div class="prompt-bar">
    <span class="prompt-label">Current Prompt</span>
    <span class="prompt-text empty" id="prompt">Connecting...</span>
  </div>

  <div class="main">
    <div class="stream-panel">
      <div class="stream" id="stream"></div>
      <div class="status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Connecting...</span>
      </div>
    </div>

    <div class="sidebar">
      <div class="attention" id="attention">
        <div class="att-head">
          <span class="att-title">Attention</span>
          <span class="badge" id="attMode">off</span>
          <span class="badge" id="attState">&mdash;</span>
        </div>
        <div class="att-next" id="attNext"></div>
        <div class="att-cue" id="attCue" hidden></div>
        <div class="att-dim" id="attReason"></div>
        <div class="att-stats" id="attStats"></div>
        <div class="att-sub">Open threads</div>
        <ul class="att-list" id="attThreads"></ul>
        <div class="att-sub">Cooldowns</div>
        <ul class="att-list" id="attCooldowns"></ul>
        <details>
          <summary>Last nominations</summary>
          <ul class="att-list" id="attNominees"></ul>
        </details>
      </div>
      <div class="sidebar-title">Recent Thoughts</div>
      <ul class="sidebar-list" id="thoughtList"></ul>
    </div>
  </div>

  <div class="overlay" id="overlay" onclick="if(event.target===this)closeOverlay()">
    <div class="overlay-content">
      <button class="overlay-close" onclick="closeOverlay()">&times;</button>
      <div id="overlayBody"></div>
    </div>
  </div>

<script>
const stream = document.getElementById('stream');
const promptEl = document.getElementById('prompt');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const thoughtList = document.getElementById('thoughtList');
const overlay = document.getElementById('overlay');
const overlayBody = document.getElementById('overlayBody');

let autoScroll = true;
let eventSource = null;
let reconnectTimer = null;

// Track auto-scroll: disable if user scrolls up, re-enable at bottom
stream.addEventListener('scroll', () => {
  const atBottom = stream.scrollHeight - stream.scrollTop - stream.clientHeight < 40;
  autoScroll = atBottom;
});

function scrollToBottom() {
  if (autoScroll) stream.scrollTop = stream.scrollHeight;
}

// --- SSE connection ---
function connect() {
  if (eventSource) { eventSource.close(); eventSource = null; }
  clearTimeout(reconnectTimer);

  eventSource = new EventSource('/api/stream');
  setStatus('connected', 'Connected');

  eventSource.addEventListener('thought_start', (e) => {
    const d = JSON.parse(e.data);
    const header = document.createElement('div');
    header.className = 'thought-header';
    header.textContent = `--- Thought ${d.thought_number} \u00b7 ${d.timestamp} ---`;
    stream.appendChild(header);
    scrollToBottom();
  });

  eventSource.addEventListener('thought_chunk', (e) => {
    const d = JSON.parse(e.data);
    // Append to last .thought-text or create one
    let last = stream.lastElementChild;
    if (!last || !last.classList.contains('thought-text')) {
      last = document.createElement('div');
      last.className = 'thought-text';
      stream.appendChild(last);
    }
    last.textContent += d.text;
    scrollToBottom();
  });

  eventSource.addEventListener('tool_call', (e) => {
    const d = JSON.parse(e.data);
    const el = document.createElement('div');
    el.className = 'tool-call' + (d.is_memory ? ' memory' : '');
    el.textContent = `\u25b6 ${d.name}(${d.args})`;
    stream.appendChild(el);
    scrollToBottom();
  });

  eventSource.addEventListener('thought_end', (e) => {
    const d = JSON.parse(e.data);
    addThoughtToSidebar(d.thought_number, d.thought, d.timestamp);
  });

  eventSource.addEventListener('prompt_set', (e) => {
    const d = JSON.parse(e.data);
    setPrompt(d.prompt);
  });

  eventSource.addEventListener('attention_decision', (e) => {
    const d = JSON.parse(e.data);
    renderDecision(d);
    if (d.applied && d.action !== 'CONTINUE') {
      const el = document.createElement('div');
      el.className = 'attention-note';
      const wait = d.action === 'IDLE' ? ` ${Math.round(d.wait_seconds)}s` : '';
      el.textContent = `\u25c6 attention: ${d.action}${wait}${d.source ? ' (' + d.source + ')' : ''} \u2014 ${d.reason || ''}`;
      stream.appendChild(el);
      scrollToBottom();
    }
  });

  eventSource.addEventListener('attention_state', (e) => {
    renderAttentionState(JSON.parse(e.data));
  });

  eventSource.addEventListener('codelet_proposals', (e) => {
    renderNominees(JSON.parse(e.data));
  });

  eventSource.addEventListener('ping', () => {});

  eventSource.onerror = () => {
    setStatus('error', 'Disconnected \u2014 reconnecting...');
    eventSource.close();
    eventSource = null;
    reconnectTimer = setTimeout(connect, 3000);
  };
}

function setStatus(state, text) {
  statusDot.className = 'status-dot ' + state;
  statusText.textContent = text;
}

function setPrompt(text) {
  promptEl.textContent = text || 'No prompt set';
  promptEl.className = 'prompt-text' + (text ? '' : ' empty');
}

// --- Attention panel ---
const attEl = document.getElementById('attention');
function showAttention() { attEl.classList.add('on'); }

function setBadge(el, text, cls) {
  el.textContent = text || '\u2014';
  el.className = 'badge' + (cls ? ' ' + cls : '');
}

function renderDecision(d) {
  if (!d) return;
  showAttention();
  setBadge(document.getElementById('attMode'), d.mode);
  setBadge(document.getElementById('attState'), d.state, 'state-' + d.state);
  const next = document.getElementById('attNext');
  next.innerHTML = '';
  const b = document.createElement('b');
  b.textContent = d.action + (d.action === 'IDLE' ? ` ${Math.round(d.wait_seconds)}s` : '');
  next.appendChild(b);
  const meta = [];
  if (d.cycle) meta.push('for thought ' + d.cycle);
  if (d.source) meta.push(d.source);
  if (d.priority) meta.push('score ' + Number(d.priority).toFixed(2));
  if (!d.applied) meta.push('not applied');
  if (d.overrode_self_prompt) meta.push('self-prompt deferred');
  next.appendChild(document.createTextNode(meta.length ? ' \u00b7 ' + meta.join(' \u00b7 ') : ''));
  const cue = document.getElementById('attCue');
  cue.hidden = !d.cue;
  cue.textContent = d.cue || '';
  document.getElementById('attReason').textContent =
    [d.reason, d.evidence].filter(Boolean).join(' \u2014 ');
}

function renderAttentionState(s) {
  if (!s || s.enabled === false) return;
  showAttention();
  setBadge(document.getElementById('attMode'), s.mode);
  setBadge(document.getElementById('attState'), s.fsm_state, 'state-' + s.fsm_state);
  const stats = [
    ['stall streak', s.consecutive_stalls], ['longest', s.longest_stall_streak],
    ['redirects', s.consecutive_redirects], ['interventions', s.interventions],
    ['idle', (s.idle_seconds_total || 0) + 's'], ['~tokens', s.approx_tokens_total],
    ['errors', s.consecutive_errors], ['faults', s.faults || 0],
  ];
  const statsEl = document.getElementById('attStats');
  statsEl.innerHTML = '';
  stats.forEach(([k, v]) => {
    const sp = document.createElement('span');
    sp.textContent = k + ' ';
    const bb = document.createElement('b');
    bb.textContent = v ?? 0;
    sp.appendChild(bb);
    statsEl.appendChild(sp);
  });
  fillList('attThreads', (s.open_threads || []).slice().reverse().slice(0, 4),
    (t) => [`#${t.created_cycle}${t.revisits ? ' \u21bb' + t.revisits : ''} `, t.text],
    `${s.open_thread_count || 0} open`);
  fillList('attCooldowns', Object.entries(s.cooldowns || {}).slice(0, 4),
    ([k, v]) => [`@${v} `, k], 'none');
  if (s.pending) renderDecision(s.pending);
}

function renderNominees(p) {
  if (!p) return;
  showAttention();
  fillList('attNominees', (p.nominees || []).slice(0, 8),
    (n) => [`${Number(n.score).toFixed(2)} ${n.action} `, `${n.source}: ${n.evidence}`], 'none');
}

function fillList(id, items, fmt, emptyText) {
  const ul = document.getElementById(id);
  ul.innerHTML = '';
  if (!items.length) {
    const li = document.createElement('li');
    li.className = 'k';
    li.textContent = emptyText;
    ul.appendChild(li);
    return;
  }
  items.forEach((it) => {
    const [k, v] = fmt(it);
    const li = document.createElement('li');
    const ks = document.createElement('span');
    ks.className = 'k';
    ks.textContent = k;
    li.appendChild(ks);
    li.appendChild(document.createTextNode(v));
    li.title = v;
    ul.appendChild(li);
  });
}

// --- Sidebar ---
function addThoughtToSidebar(num, text, timestamp) {
  const li = document.createElement('li');
  li.className = 'sidebar-item';
  const preview = (text || '').replace(/\n/g, ' ').slice(0, 120);
  li.innerHTML = `<div class="title">Thought ${num} &middot; ${timestamp || ''}</div><div class="preview">${escapeHtml(preview)}</div>`;
  li.onclick = () => showThought(text);
  thoughtList.prepend(li);
}

function showThought(text) {
  overlayBody.textContent = text;
  overlay.classList.add('active');
}

function closeOverlay() {
  overlay.classList.remove('active');
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Keyboard: Escape closes overlay
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeOverlay();
});

// --- Initial data load ---
async function loadInitial() {
  try {
    const r = await fetch('/api/current-prompt');
    const d = await r.json();
    setPrompt(d.prompt);
  } catch { setPrompt(null); }

  try {
    const r = await fetch('/api/attention');
    const d = await r.json();
    if (d.enabled) {
      const last = (d.decisions || []).slice(-1)[0];
      if (last) renderDecision(last);
      renderAttentionState(d.state);  // pending (next) decision wins
      renderNominees(d.proposals);
    }
  } catch {}

  try {
    const r = await fetch('/api/thoughts');
    const d = await r.json();
    (d.thoughts || []).forEach((t) => {
      const li = document.createElement('li');
      li.className = 'sidebar-item';
      li.innerHTML = `<div class="title">${escapeHtml(t.title)}</div><div class="preview">${escapeHtml(t.preview)}</div>`;
      li.onclick = async () => {
        try {
          const res = await fetch('/api/thought/' + encodeURIComponent(t.id));
          const data = await res.json();
          showThought(data.content);
        } catch { showThought('Failed to load thought.'); }
      };
      thoughtList.appendChild(li);
    });
  } catch {}
}

// --- Boot ---
loadInitial();
connect();
</script>
</body>
</html>
